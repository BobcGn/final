name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify required project facts
        shell: bash
        run: |
          set -euo pipefail
          required_files=(
            AGENTS.md
            README.md
            hardware/AGENTS.md
            hardware/README.md
            backend/AGENTS.md
            backend/README.md
            client-kmp/AGENTS.md
            client-kmp/README.md
            client-wx-native/AGENTS.md
            client-wx-native/README.md
            docs/implementation-plan.md
            docs/device-protocol.md
            docs/api/openapi.yaml
          )
          for file in "${required_files[@]}"; do
            test -s "$file"
          done

      - name: Parse OpenAPI YAML
        run: >-
          ruby -e 'require "yaml";
          doc = YAML.safe_load_file("docs/api/openapi.yaml", aliases: true);
          abort "OpenAPI paths missing" unless doc["paths"].is_a?(Hash) && !doc["paths"].empty?'

      - name: Reject whitespace errors
        run: git diff --check HEAD^

  backend:
    name: Backend
    runs-on: ubuntu-latest
    # A disposable CI service, separate from developers' existing postgres-dev.
    # Without TEST_DATABASE_URL the store integration suite silently skips and
    # the reported coverage does not include the production persistence path.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: lab_test
          POSTGRES_PASSWORD: lab_test
          POSTGRES_DB: lab_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lab_test -d lab_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Keep CI aligned with backend/go.mod and the local development toolchain.
          go-version: '1.27.1'
          cache: false

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Run vet
        run: go vet ./...

      - name: Run tests with race detector and coverage
        shell: bash
        env:
          TEST_DATABASE_URL: postgres://lab_test:lab_test@localhost:5432/lab_test?sslmode=disable
        run: |
          set -euo pipefail
          go test -race -coverprofile=coverage.out ./...
          coverage="$(go tool cover -func=coverage.out | awk '/^total:/ {gsub(/%/, "", $3); print $3}')"
          echo "Backend coverage: ${coverage}%" | tee -a "$GITHUB_STEP_SUMMARY"
          awk -v coverage="$coverage" 'BEGIN { if ((coverage + 0) < 80) exit 1 }'

      - name: Upload Backend coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.out
          if-no-files-found: error
          retention-days: 14

  hardware:
    name: Hardware
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Arm GNU Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc-arm-none-eabi cmake make clang llvm

      - name: Configure firmware
        run: |
          cmake -S hardware -B out/hardware-debug -G "Unix Makefiles" \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/hardware/cmake/arm-none-eabi-gcc.cmake" \
            -DCMAKE_BUILD_TYPE=Debug

      - name: Build firmware
        run: cmake --build out/hardware-debug --parallel 2

      # The host suite is introduced by the hardware feature PR. Keep this CI
      # preparation PR mergeable on its own; once the suite exists it is required.
      - name: Configure host tests
        if: hashFiles('hardware/tests/CMakeLists.txt') != ''
        run: |
          cmake -S hardware/tests -B out/hardware-host-tests \
            -DCMAKE_BUILD_TYPE=Debug

      - name: Build host tests
        if: hashFiles('hardware/tests/CMakeLists.txt') != ''
        run: cmake --build out/hardware-host-tests --parallel 2

      - name: Run host tests
        if: hashFiles('hardware/tests/CMakeLists.txt') != ''
        run: ./out/hardware-host-tests/host_tests

      - name: Report core coverage
        if: hashFiles('hardware/tests/CMakeLists.txt') != ''
        shell: bash
        run: |
          set -euo pipefail
          # Coverage uses Clang source-based instrumentation; the ordinary
          # host test build above may continue to use the runner's default GCC.
          cmake -S hardware/tests -B out/hardware-coverage \
            -DCMAKE_C_COMPILER=clang -DENABLE_COVERAGE=ON
          cmake --build out/hardware-coverage --parallel 2
          ./hardware/scripts/host_coverage.sh out/hardware-coverage \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: stm32-debug-firmware
          path: |
            out/hardware-debug/STM32_Project1.elf
            out/hardware-debug/STM32_Project1.hex
            out/hardware-debug/STM32_Project1.bin
            out/hardware-debug/STM32_Project1.map
          if-no-files-found: error
          retention-days: 14

      - name: Upload host test coverage
        if: hashFiles('hardware/tests/CMakeLists.txt') != ''
        uses: actions/upload-artifact@v4
        with:
          name: hardware-core-coverage
          path: out/hardware-coverage/host_tests.profdata
          if-no-files-found: error
          retention-days: 14

  kmp-android:
    name: KMP Android
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default includes the retired `tools` package, which
          # makes sdkmanager fail before the KMP build starts.
          packages: platform-tools

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test shared logic and build Android debug APK
        working-directory: client-kmp
        run: ./gradlew :shared:testAndroidHostTest :androidApp:assembleDebug --no-daemon

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kmp-android-debug-apk
          path: client-kmp/androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  wechat-native:
    name: WeChat Native
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client-wx-native
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find . -type f -name '*.js' -print0)

      - name: Validate JSON files
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node -e 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))' "$file"
          done < <(find . -type f -name '*.json' -print0)
