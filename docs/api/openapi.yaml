openapi: 3.0.3
info:
  title: Smart Lab Environment Monitoring API
  version: 1.0.0
  description: >-
    Frozen REST and WebSocket contract for the Go backend (SHIXUN-3). Route
    paths, field names, units, enums, error codes and lifecycle semantics are
    frozen for phase 1. The device-facing MQTT contract lives in
    device-protocol.md; both must be changed together.
servers:
  - url: http://localhost:8080
tags:
  - name: health
  - name: device
  - name: telemetry
  - name: alerts
  - name: thresholds
  - name: commands
  - name: realtime
paths:
  /healthz:
    get:
      operationId: getHealth
      tags: [health]
      security: []
      summary: Check process liveness
      description: >-
        Process-level liveness only. It does not check the database, the MQTT
        broker, or any device, so it still returns 200 while those are down.
        Readiness, when needed, must be a separate /readyz route.
      responses:
        '200':
          description: Process is running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /api/v1/devices/{deviceId}/status:
    get:
      operationId: getDeviceStatus
      tags: [device]
      summary: Get the current device and connectivity state
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      responses:
        '200':
          description: Current device state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceStatus'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/devices/{deviceId}/telemetry/latest:
    get:
      operationId: getLatestTelemetry
      tags: [telemetry]
      summary: Get the latest valid telemetry sample
      description: >-
        Returns the newest sample that passed schema, range and device checks.
        Returns 404 when the device has no valid telemetry yet; never a
        zero-filled object.
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      responses:
        '200':
          description: Latest sample
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetryPoint'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/devices/{deviceId}/telemetry:
    get:
      operationId: listTelemetry
      tags: [telemetry]
      summary: Query historical telemetry
      description: >-
        Ascending event-time order is the default. Ordering and the pagination
        cursor use the stable key (eventTime, bootId, sequence) so that
        equal timestamps cannot skip or duplicate rows. The maximum query span
        is 31 days; longer ranges need aggregation or an export job.
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Order'
      responses:
        '200':
          description: Telemetry page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetryPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/devices/{deviceId}/alerts:
    get:
      operationId: listAlerts
      tags: [alerts]
      summary: Query alert events
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: state
          in: query
          schema:
            $ref: '#/components/schemas/AlertState'
        - name: active
          in: query
          description: Return only events that have not ended
          schema:
            type: boolean
      responses:
        '200':
          description: Alert event page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/devices/{deviceId}/thresholds:
    get:
      operationId: getThresholds
      tags: [thresholds]
      summary: Get desired and device-confirmed thresholds
      description: >-
        A confirmed version lower than the desired version means the command is
        still pending, failed, or the device is offline. The API never presents
        the desired value as if the device had confirmed it.
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      responses:
        '200':
          description: Current thresholds
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Thresholds'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updateThresholds
      tags: [thresholds]
      summary: Validate and enqueue a threshold update
      description: >-
        HTTP 202 means the backend accepted and enqueued the command. It does
        not mean the device wrote Flash. Clients must wait for the command
        acknowledgement or the timeout result.
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThresholdUpdate'
      responses:
        '202':
          description: Command accepted; device acknowledgement is pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/VersionConflict'
        '422':
          $ref: '#/components/responses/InvalidThreshold'
        '503':
          $ref: '#/components/responses/BrokerUnavailable'
  /api/v1/devices/{deviceId}/commands/mute:
    post:
      operationId: setDeviceMute
      tags: [commands]
      summary: Enqueue a buzzer mute or unmute command
      description: >-
        Muting only suppresses the buzzer. It never clears localAlarm, never
        disables the LED or OLED indication, and never stops sampling or
        telemetry reporting.
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MuteCommand'
      responses:
        '202':
          description: Command accepted; device acknowledgement is pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/VersionConflict'
        '503':
          $ref: '#/components/responses/BrokerUnavailable'
  /api/v1/devices/{deviceId}/commands/{requestId}:
    get:
      operationId: getCommandStatus
      tags: [commands]
      summary: Get the current state of a control command
      description: >-
        Closes the control loop for clients that were disconnected when the
        acknowledgement arrived. Returns the backend-recorded lifecycle state,
        which may still be pending when the device has not confirmed yet.
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - name: requestId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 64
      responses:
        '200':
          description: Command lifecycle state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandStatus'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /ws/v1/devices/{deviceId}/telemetry:
    get:
      operationId: streamDeviceTelemetry
      tags: [realtime]
      summary: Upgrade to the per-device realtime WebSocket stream
      description: >-
        Standard WebSocket upgrade. Authentication failures are reported as an
        HTTP error before the upgrade. The stream carries incremental events
        only; it does not replay history, so a reconnecting client must fetch
        latest or history over REST before resubscribing. Event ids may repeat,
        so clients deduplicate by eventId.
      x-websocket: true
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      responses:
        '101':
          description: WebSocket protocol switched; server sends WsEnvelope JSON
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/RateLimited'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: >-
        Phase-1 placeholder. The backend runs with auth disabled
        (AUTH_MODE=none) only for local development; control routes must never
        be exposed publicly without tokens.
  parameters:
    DeviceId:
      name: deviceId
      in: path
      required: true
      description: Must match the deviceId carried in MQTT payloads
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{1,32}$'
      example: MCU001
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Repeating the same device and key with the same payload
        returns the same command result and never publishes a second command.
        The same key with a different payload is a 409 version_conflict.
        Recommended value: UUID or ULID.
      schema:
        type: string
        minLength: 1
        maxLength: 64
      example: 01K5H0PN0M1N9NB8B7RBTVWT8P
    From:
      name: from
      in: query
      description: Inclusive RFC 3339 timestamp; defaults to now-1h
      schema:
        type: string
        format: date-time
    To:
      name: to
      in: query
      description: Exclusive RFC 3339 timestamp; defaults to now
      schema:
        type: string
        format: date-time
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 200
    Cursor:
      name: cursor
      in: query
      description: >-
        Opaque pagination cursor returned by the previous page. When present,
        from, to and order must match the first page request.
      schema:
        type: string
    Order:
      name: order
      in: query
      schema:
        type: string
        enum: [asc, desc]
        default: asc
  responses:
    BadRequest:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthenticated:
      description: Missing or invalid credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: The caller may not access this device or perform this control action
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Device, command or data was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    VersionConflict:
      description: Threshold version or idempotency key conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    InvalidThreshold:
      description: Threshold value or unit is outside the device-supported range
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    RateLimited:
      description: The realtime stream is at capacity (MAX_WS_CLIENTS); only the WebSocket route returns this
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    BrokerUnavailable:
      description: The control command could not be published to the broker
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    ErrorCode:
      type: string
      description: Frozen error code set
      enum:
        - invalid_request
        - unauthenticated
        - forbidden
        - device_not_found
        - command_not_found
        - version_conflict
        - invalid_threshold
        - rate_limited
        - internal_error
        - broker_unavailable
        - device_ack_timeout
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
            requestId:
              type: string
            details:
              type: object
              additionalProperties: true
    AlarmCause:
      type: string
      enum:
        - temperature_high
        - humidity_high
        - gas_high
        - rapid_temperature_rise
        - rapid_gas_rise
        - sensor_fault
    AlertState:
      type: string
      description: >-
        Phase-1 alert states. An explicit acknowledgement endpoint does not
        exist yet, so no acknowledged state is emitted; adding one is a phase-2
        contract change.
      enum: [normal, suspect, fire_warning, recovered]
    DeviceStatus:
      type: object
      required: [deviceId, connectivity, alarmState, lastSeenAt]
      properties:
        deviceId:
          type: string
        connectivity:
          type: string
          enum: [online, offline, unknown]
        alarmState:
          $ref: '#/components/schemas/AlertState'
        buzzerMuted:
          type: boolean
        localAlarm:
          type: boolean
        offlineAfterSeconds:
          type: integer
          minimum: 1
          description: Consecutive telemetry-silence threshold used for offline detection
        lastSeenAt:
          type: string
          format: date-time
          nullable: true
          description: Server receive time of the last valid telemetry
        thresholdVersion:
          type: object
          properties:
            desired:
              type: integer
              minimum: 1
            confirmed:
              type: integer
              minimum: 1
              nullable: true
    TelemetryPoint:
      type: object
      required:
        - deviceId
        - receivedAt
        - temperatureC
        - humidityRh
        - gasAdcRaw
        - gasAdcFiltered
        - localAlarm
      properties:
        deviceId:
          type: string
        bootId:
          type: string
          description: Device-generated token, unique per power cycle
        sequence:
          type: integer
          format: int64
          description: Monotonic within one bootId
        timestamp:
          type: string
          format: date-time
          nullable: true
          description: Device event time; null until the device clock is synced
        receivedAt:
          type: string
          format: date-time
          description: Always filled by the backend
        temperatureC:
          type: number
          format: float
        humidityRh:
          type: number
          format: float
        gasAdcRaw:
          type: integer
          minimum: 0
          maximum: 4095
        gasAdcFiltered:
          type: integer
          minimum: 0
          maximum: 4095
        gasPpm:
          type: number
          format: float
          nullable: true
        gasCalibrated:
          type: boolean
          description: False means gasPpm comes from an uncalibrated estimate
        localAlarm:
          type: boolean
        alarmCauses:
          type: array
          items:
            $ref: '#/components/schemas/AlarmCause'
        buzzerMuted:
          type: boolean
        network:
          type: string
          enum: [online, reconnecting]
        sensorFault:
          type: boolean
    TelemetryPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TelemetryPoint'
        nextCursor:
          type: string
          nullable: true
    AlertEvent:
      type: object
      required: [id, deviceId, state, startedAt, evidence]
      properties:
        id:
          type: string
        deviceId:
          type: string
        state:
          $ref: '#/components/schemas/AlertState'
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
          nullable: true
        evidence:
          $ref: '#/components/schemas/AlertEvidence'
    AlertEvidence:
      type: object
      description: >-
        Stored at trigger time. Clients must not reconstruct the reason for a
        historical alert from the latest live values. The gas term is measured
        in ADC codes rather than ppm because the MQ135 estimate is uncalibrated
        and gasPpm may be absent; the rise is a difference and stays meaningful
        without calibration.
      required:
        - gasAdcRise
        - temperatureRateCPerMinute
        - sampleCount
      properties:
        gasAdcRise:
          type: integer
          description: Filtered gas rise across the window, in ADC codes
        gasAdcRiseThreshold:
          type: integer
          description: Configured rise threshold at trigger time, in ADC codes
        temperatureRateCPerMinute:
          type: number
        temperatureRateThresholdCPerMinute:
          type: number
        sampleCount:
          type: integer
          minimum: 1
        windowSeconds:
          type: integer
          minimum: 1
    AlertPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AlertEvent'
        nextCursor:
          type: string
          nullable: true
    Thresholds:
      type: object
      required: [desiredVersion, temperatureHighC, humidityHighRh, gasHighPpm]
      properties:
        desiredVersion:
          type: integer
          minimum: 1
          description: Version 1 is the compile-time firmware default
        confirmedVersion:
          type: integer
          minimum: 1
          nullable: true
        temperatureHighC:
          type: number
          minimum: 0
          maximum: 80
        humidityHighRh:
          type: number
          minimum: 0
          maximum: 100
        gasHighPpm:
          type: number
          minimum: 1
          maximum: 999
        updatedAt:
          type: string
          format: date-time
        confirmationState:
          type: string
          enum: [confirmed, pending, rejected, timed_out]
    ThresholdUpdate:
      type: object
      required: [temperatureHighC, humidityHighRh, gasHighPpm]
      additionalProperties: false
      properties:
        temperatureHighC:
          type: number
          minimum: 0
          maximum: 80
        humidityHighRh:
          type: number
          minimum: 0
          maximum: 100
        gasHighPpm:
          type: number
          minimum: 1
          maximum: 999
    MuteCommand:
      type: object
      required: [muted]
      additionalProperties: false
      properties:
        muted:
          type: boolean
    CommandAccepted:
      type: object
      required: [requestId, status]
      properties:
        requestId:
          type: string
        status:
          type: string
          enum: [pending]
          description: Accepted for publication; the device has not confirmed yet
        desiredVersion:
          type: integer
          minimum: 1
        expiresAt:
          type: string
          format: date-time
    CommandStatus:
      type: object
      required: [requestId, deviceId, type, state, acceptedAt]
      properties:
        requestId:
          type: string
        deviceId:
          type: string
        type:
          type: string
          enum: [set_mute, set_thresholds]
        state:
          type: string
          description: >-
            accepted and published are backend states; applied, rejected,
            expired, duplicate and failed come from the device
            acknowledgement. timed_out and publish_failed are terminal backend
            outcomes.
          enum:
            - accepted
            - published
            - applied
            - rejected
            - expired
            - duplicate
            - failed
            - timed_out
            - publish_failed
        acceptedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true
        expiresAt:
          type: string
          format: date-time
        desiredVersion:
          type: integer
          minimum: 1
          nullable: true
        confirmedVersion:
          type: integer
          minimum: 1
          nullable: true
        errorCode:
          type: string
          nullable: true
    WsEnvelope:
      type: object
      required: [type, eventId, occurredAt, deviceId, data]
      properties:
        type:
          type: string
          enum:
            - telemetry.updated
            - device.status_changed
            - alert.state_changed
            - command.status_changed
            - thresholds.confirmed
        eventId:
          type: string
          description: Clients deduplicate on this value; duplicates are possible
        occurredAt:
          type: string
          format: date-time
        deviceId:
          type: string
        data:
          type: object
          additionalProperties: true
          description: >-
            Event payload. telemetry.updated carries TelemetryPoint fields;
            command.status_changed carries CommandStatus fields;
            device.status_changed carries connectivity and lastSeenAt;
            alert.state_changed carries AlertEvent fields.
security:
  - BearerAuth: []
